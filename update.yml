name: Обновление тарифов и публикация сайта

on:
  schedule:
    - cron: '17 3 * * *'      # каждый день в 03:17 UTC (11:17 в Улан-Удэ)
  push:
    branches: [main]
  workflow_dispatch:           # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      update_result: ${{ steps.upd.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обновить тарифы с сайта РСТ Бурятии
        id: upd
        continue-on-error: true
        run: python scripts/update_tariffs.py

      - name: Сохранить новый data.json
        run: |
          if ! git diff --quiet data.json; then
            git config user.name "tariff-bot"
            git config user.email "tariff-bot@users.noreply.github.com"
            git add data.json
            git commit -m "Обновление тарифов РСТ"
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Собрать сайт
        run: |
          mkdir _site
          cp index.html data.json manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сайт публикуется в любом случае. Если тарифы обновить не удалось, этот шаг помечает запуск красным,
  # и GitHub пришлёт письмо владельцу репозитория.
  report:
    needs: [build, deploy]
    if: needs.build.outputs.update_result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Не удалось автоматически обновить тарифы с сайта РСТ. Сайт работает на прежних данных."
          echo "Проверьте тарифы вручную и при необходимости поправьте data.json."
          exit 1
